<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38F6FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2"/>
  
  <!-- Stylized Technosys Cyan "T" Bar -->
  <path d="M 20 25 L 80 25 L 80 37 L 57 37 L 57 80 L 43 80 L 43 37 L 20 37 Z" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
  
  <!-- Glowing Purple Blocks -->
  <rect x="62" y="45" width="16" height="16" rx="4" fill="url(#purpleGrad)" filter="url(#neonGlow)"/>
  <rect x="62" y="65" width="16" height="15" rx="4" fill="url(#purpleGrad)" opacity="0.85"/>
</svg>
